[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tnshapg"
version = "0.1.0"
description = "TN-SHAP-G: Graph-Structured Tensor Network Surrogates for Shapley Values and Interactions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Farzaneh Heidari"},
    {name = "Guillaume Rabusseau"}
]
keywords = [
    "shapley values",
    "tensor networks", 
    "graph neural networks",
    "explainability",
    "interpretability",
    "machine learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=1.10.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "networkx>=2.6.0",
    "tqdm>=4.60.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=0.950",
]
optimization = [
    "opt_einsum>=3.3.0",
]
notebook = [
    "jupyter>=1.0.0",
    "matplotlib>=3.4.0",
]
all = [
    "tnshapg[dev,optimization,notebook]",
]

[project.urls]
Homepage = "https://github.com/farzana0/TN-SHAP-G"
Documentation = "https://github.com/farzana0/TN-SHAP-G#readme"
Repository = "https://github.com/farzana0/TN-SHAP-G"
Issues = "https://github.com/farzana0/TN-SHAP-G/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
